# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metralectl"
description = "Launch Metrale Engine inference recipes on NVIDIA DGX Spark and other local accelerators."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[[bin]]
name = "metralectl"
path = "src/main.rs"

[dependencies]
metralectl-agent.workspace = true
metralectl-core.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_yaml_ng.workspace = true
metralectl-protocol = { version = "0.2.0", path = "../metralectl-protocol" } # x-release-please-version
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
# The recording mocks live behind a feature so they never ship in a release
# binary, but downstream test suites need them.
metralectl-core = { workspace = true, features = ["test-mocks"] }

[lints]
workspace = true
