# SPDX-License-Identifier: MIT OR Apache-2.0
name: Engine recipes

# recipes/ and vendor/serve-options.v2.json mirror one Metrale/metrale-inference
# release, named in vendor/engine-pin.toml. This moves the pin to the newest
# release that carries recipe assets (or the one given) and opens, or refreshes,
# a single pull request with the result. It is only the author: the pull
# request's `engine-mirror` CI job is what verifies the content against the pin.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "engine release tag to pin, e.g. b7 (empty: the newest with recipe assets)"
        required: false

permissions:
  contents: read

concurrency:
  group: engine-recipes
  cancel-in-progress: false

jobs:
  sync:
    name: mirror the engine release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Pin the release and rewrite the mirror
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -eu
          if [ -n "$RELEASE" ]; then
            python3 scripts/engine-recipes.py sync --root . --release "$RELEASE"
          else
            python3 scripts/engine-recipes.py sync --root . --latest
          fi
          python3 scripts/engine-recipes.py check --root .
          pinned=$(python3 -c 'import tomllib; print(tomllib.load(open("vendor/engine-pin.toml", "rb"))["release"])')
          echo "release=$pinned" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain -- recipes vendor)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "already mirroring $pinned"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # One rolling branch and one pull request, like the release PR: a newer
      # engine release replaces the pending one instead of queueing behind it.
      # Its CI runs need approving, as the release PR's do (docs/RELEASING.md).
      - name: Open or refresh the pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.sync.outputs.release }}
        run: |
          set -eu
          branch=engine-recipes/sync
          title="fix(recipes): mirror engine release $RELEASE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add -A -- recipes vendor/serve-options.v2.json vendor/engine-pin.toml
          stat=$(git diff --cached --stat)
          git commit -q -m "$title"
          git push --force origin "$branch"
          commit=$(python3 -c 'import tomllib; print(tomllib.load(open("vendor/engine-pin.toml", "rb"))["commit"])')
          body=$(printf '%s\n\n%s\n\n```\n%s\n```\n\n%s\n' \
            "Mirrors \`recipes/\` and \`vendor/serve-options.v2.json\` from Metrale/metrale-inference release \`$RELEASE\` (\`$commit\`), verified against the release's \`.sha256\` sidecars and its \`index.json\`." \
            "Written by the engine-recipes workflow. Recipe changes belong in the engine repository; CI refuses a hand edit here." \
            "$stat" \
            "This branch's CI runs need approving before they start (docs/RELEASING.md).")
          number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --title "$title" --body "$body"
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" -f title="$title" -f body="$body" > /dev/null
            echo "refreshed #$number"
          fi
